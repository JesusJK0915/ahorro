plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    namespace "com.jesusjk0915.ahorro"
    defaultConfig {
        applicationId "com.jesusjk0915.ahorro"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"

        resValue "string", "appName", "Ahorros"
        resValue "string", "launcherName", "Ahorros"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.6.2'
}
