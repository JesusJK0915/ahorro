name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept SDK licenses & install build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;36.1.0" "platforms;android-34"

      - name: Install Bubblewrap
        run: |
          for i in 1 2 3; do
            npm install -g @bubblewrap/cli && break
            echo "intent $i falló, reintentando..."
            sleep 10
          done

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Prepare TWA project
        run: |
          chmod +x twa/gradlew
          if [ ! -e "$ANDROID_HOME/bin" ]; then ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"; fi
          if [ ! -e "$ANDROID_HOME/tools" ]; then ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/tools"; fi
          mkdir -p ~/.bubblewrap
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa
          printf 'n\n' | bubblewrap build \
            --signingKeyPath ../keystore.jks \
            --signingKeyAlias "ahorros"

      - name: Read version from app.js
        id: ver
        run: |
          V=$(grep -oP 'APP_VERSION = "\K[^"]+' app.js)
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Verify APK exists
        run: test -f twa/app-release-signed.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Ahorros v${{ steps.ver.outputs.version }}
          files: twa/app-release-signed.apk
          generate_release_notes: true

      - name: Update version.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          APK_URL="https://github.com/${REPO}/releases/download/v${VERSION}/app-release-signed.apk"
          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${APK_URL}",
            "notes": "Nueva version ${VERSION}."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add version.json
          git commit -m "chore: bump version.json to ${VERSION}" || exit 0
          git push

      - name: Cleanup
        if: always()
        run: rm -f keystore.jks