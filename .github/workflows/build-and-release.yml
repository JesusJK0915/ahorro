name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Accept SDK licenses & install build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;36.1.0" "platforms;android-36"

      - name: Copy web assets into APK
        run: |
          cp index.html styles.css app.js lock.js icon.svg manifest.webmanifest twa/app/src/main/assets/

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build signed APK (WebView)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x twa/gradlew
          cd twa
          set -o pipefail
          {
            ./gradlew assembleRelease --no-daemon
            APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
              --ks ../keystore.jks \
              --ks-key-alias ahorros \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out app-release-signed.apk \
              "$APK_UNSIGNED"
          } 2>&1 | tee ../build.log

      - name: Show build error detail
        if: failure()
        run: |
          MSG=$(grep -E -A4 -B2 "error:|What went wrong|Execution failed|FAILURE:|Could not|cannot find" build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' || tail -40 build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
          echo "::error::$MSG"

      - name: Read version from app.js
        id: ver
        run: |
          V=$(grep -oP 'APP_VERSION = "\K[^"]+' app.js)
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Verify APK exists
        run: test -f twa/app-release-signed.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Ahorros v${{ steps.ver.outputs.version }}
          files: twa/app-release-signed.apk
          generate_release_notes: true

      - name: Update version.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          APK_URL="https://github.com/${REPO}/releases/download/v${VERSION}/app-release-signed.apk"
          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${APK_URL}",
            "notes": "Nueva version ${VERSION}."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add version.json
          git commit -m "chore: bump version.json to ${VERSION}" || exit 0
          git push

      - name: Cleanup
        if: always()
        run: rm -f keystore.jks
